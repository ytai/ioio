apply plugin: "java"

tasks.register("distJar", Jar) {
    dependsOn configurations.runtimeClasspath
    archiveClassifier = "standalone"
    archiveVersion = ""
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes "Main-Class": "ioio.connection_tester_pc.IOIOConnectionTesterMain"
    }
    from(sourceSets.main.output)
    from({
        configurations.runtimeClasspath.findAll { it.exists() }.collect { it.isDirectory() ? it : zipTree(it) }
    })
}

tasks.build.dependsOn distJar

dependencies {
    implementation project(':IOIOLibPC')
    implementation project(':IOIOConnectionTester')
    implementation 'com.google.guava:guava:32.1.3-jre'
}
