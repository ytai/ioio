apply plugin: "java"

tasks.register("distJar", Jar) {
    dependsOn configurations.runtimeClasspath
    archiveClassifier = "standalone"
    archiveVersion = ""
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes "Main-Class": "ioio.bridge.Main"
    }
    from(sourceSets.main.output)
    from({
        configurations.runtimeClasspath.findAll { it.exists() }.collect { it.isDirectory() ? it : zipTree(it) }
    })
}

tasks.register("zip", Zip) {
    dependsOn distJar
    archiveBaseName = "IOIOBridge"
    archiveVersion = "0103"

    from distJar
    from("ioiobridge", "ioiobridge.bat")
    rename "IOIOBridge-standalone.jar", "ioiobridge.jar"
}

tasks.build.dependsOn zip

dependencies {
    implementation "com.sparetimelabs:purejavacomm:1.0.1"
}
